services:
  mcp-server:
    build: .
    environment:
      - MCP_LOG_COMMANDS=true
      - WORKDIR=/home/projects
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/shell"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

  tester:
    image: python:3.10-slim
    depends_on:
      mcp-server:
        condition: service_healthy
    volumes:
      - ./test_mcp_connection.py:/app/test_mcp_connection.py
    working_dir: /app
    environment:
      - MCP_SERVER_URL=http://mcp-server:8000/shell
    command: >
      sh -c "pip install mcp && python test_mcp_connection.py"
