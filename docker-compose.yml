services:
  mcp-server:
    image: docker.nautil.org/mcp-python:latest
    environment:
      - MCP_LOG_COMMANDS=true
      - WORKDIR=/home/projects
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/sse || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

  tester:
    image: docker.nautil.org/mcp-tester:latest
    depends_on:
      mcp-server:
        condition: service_healthy
    volumes:
      - ./test_mcp_connection.py:/app/test_mcp_connection.py
    working_dir: /app
    environment:
      - MCP_SERVER_URL=http://mcp-server:8000/
    command: >
      sh -c "python test_mcp_connection.py"
